<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Eight Bells</title>
<meta name="apple-mobile-web-app-title" content="Eight Bells">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1714">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
@font-face{font-family:Cinzel;font-weight:400;src:url(fonts/cinzel-400.woff2) format("woff2")}
@font-face{font-family:Cinzel;font-weight:700;src:url(fonts/cinzel-700.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:500;src:url(fonts/cormorant-500.woff2) format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:italic;src:url(fonts/cormorant-500i.woff2) format("woff2")}
:root{--sea:#0b1714;--sea2:#12241f;--foam:#d9cfb6;--bronze:#a8763a;--bronze2:#e2b46a;--dark:#3d2812}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sea);color:var(--foam);overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;
  font-family:"Cormorant Garamond",Georgia,serif;
  background:radial-gradient(ellipse at 50% 20%,var(--sea2),var(--sea) 70%);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
h1{font-family:Cinzel,serif;font-weight:400;letter-spacing:.3em;font-size:clamp(18px,3vw,30px);opacity:.75}
#start{font-family:Cinzel,serif;font-size:clamp(18px,3vw,26px);letter-spacing:.15em;color:var(--foam);background:none;
  border:1px solid rgba(217,207,182,.5);border-radius:999px;padding:18px 38px}
#bells{display:grid;grid-template-columns:repeat(8,1fr);gap:clamp(6px,1.4vw,18px);width:min(1100px,100%);align-items:end}
@media (orientation:portrait){#bells{grid-template-columns:repeat(4,1fr);row-gap:4vh}}
.bell{position:relative;border:none;background:none;display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.bell svg{width:100%;height:auto;display:block;transform-origin:50% 6%;transition:filter .2s}
.bell span{font-family:Cinzel,serif;font-weight:700;font-size:clamp(20px,3.4vw,38px);color:var(--foam);margin-top:.4em}
.bell.ring svg{animation:swing .9s ease-out;filter:drop-shadow(0 0 14px rgba(226,180,106,.55))}
@keyframes swing{0%{transform:rotate(0)}15%{transform:rotate(9deg)}35%{transform:rotate(-7deg)}55%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
#trail{min-height:1.6em;font-family:Cinzel,serif;font-size:clamp(18px,2.6vw,28px);letter-spacing:.35em;opacity:.8;text-align:center}
#row{display:flex;gap:16px;align-items:center}
#again,#replay{font-family:Cinzel,serif;font-size:15px;letter-spacing:.15em;color:var(--foam);background:none;
  border:1px solid rgba(217,207,182,.35);border-radius:999px;padding:10px 20px;opacity:.8}
#replay{display:none}
#msg{min-height:2.6em;font-style:italic;font-size:clamp(18px,2.6vw,28px);text-align:center;max-width:900px;transition:opacity .6s}
#water{position:fixed;left:0;right:0;bottom:0;height:9vh;pointer-events:none;
  background:linear-gradient(180deg,rgba(60,110,95,0),rgba(60,110,95,.22));transition:height 3s ease,background 1.5s}
#water.stir{background:linear-gradient(180deg,rgba(120,170,150,0),rgba(120,170,150,.38))}
#water.rise{height:46vh;background:linear-gradient(180deg,rgba(80,130,115,0),rgba(80,130,115,.45))}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Eight Bells</h1>
<button id="start">Tap to wake the bells</button>
<div id="bells" class="hidden"></div>
<div id="trail" class="hidden"></div>
<div id="row" class="hidden"><button id="again">Start again</button><button id="replay">Hear it again</button></div>
<div id="msg"></div>
<div id="water"></div>
<script>
const P={"iter": 60000, "salt": "BvnKgZW8Tt7S3DrzqBbHFA==", "iv": "+Bohi1Q8rvQqGtSt", "ct": "OItrMrLKNrZNzBlMZusDppZFjtd11lhivh93RZezMvovBzBcUpHTXzoy5bj6Ng==", "psalt": "l9f2amLee8uVYNcqp5mpdQ==", "piv": "9celgAMdt+Cy0VM2", "pct": "4ka/74KyHEqdwBPecSWOo9z8GHdy3GwZ1eU5OJFlSw==", "aiv": "n7LbdMo9eqYwYTCt", "hymn": "hymn-3a620991fa.bin"};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=new TextEncoder();
let hymnCT=null; let ctx=null, buffers={}, hymnBuf=null, trail=[], solved=false, busy=Promise.resolve();
window.__state={solved:false,prefixHits:0,checks:0};

function bellSVG(n){
  const s=1.15-(n-1)*0.05;                       // lowest bell is the biggest
  return `<svg viewBox="0 0 120 140" style="width:${Math.round(s*100)}%">
   <defs><linearGradient id="g${n}" x1="0" x2="1"><stop offset="0" stop-color="#5a3a17"/><stop offset=".45" stop-color="#e2b46a"/>
   <stop offset=".7" stop-color="#a8763a"/><stop offset="1" stop-color="#4a2f12"/></linearGradient></defs>
   <rect x="54" y="2" width="12" height="14" rx="4" fill="#4a2f12"/>
   <path d="M60 12 C34 12 28 34 26 62 C24 88 18 104 8 116 L112 116 C102 104 96 88 94 62 C92 34 86 12 60 12Z" fill="url(#g${n})"/>
   <rect x="6" y="113" width="108" height="9" rx="4" fill="#7a5226"/>
   <circle cx="60" cy="128" r="9" fill="#3d2812"/></svg>`;
}

// ---- audio engine -------------------------------------------------------------
// iOS can leave Web Audio silent after the screen locks or Safari loses focus, even while
// it reports "running" (WebKit bug 276016). So we keep the raw mp3 bytes in memory and can
// rebuild the whole AudioContext from them, with no network, on the next tap.
const raw={};            // n -> ArrayBuffer (bells), 'hymn' -> decrypted mp3 bytes
function setSession(){try{if('audioSession' in navigator)navigator.audioSession.type='playback'}catch(_){}}
setSession();            // before any AudioContext exists: lets the bells ring with the silent switch on (iOS 16.4+)
function decode(bytes){return new Promise((res,rej)=>ctx.decodeAudioData(bytes.slice(0),res,rej))}
async function fetchBytes(url){const r=await fetch(url);if(!r.ok)throw new Error(url+' '+r.status);return r.arrayBuffer()}
async function buildContext(){             // must be called inside a tap
  if(ctx&&ctx.state!=='closed'){try{ctx.close().catch(()=>{})}catch(_){}}
  setSession();
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  ctx.onstatechange=()=>{if(ctx.state==='interrupted'&&!document.hidden)quiet()};
  if(ctx.state!=='running'){try{await ctx.resume()}catch(_){}}
  const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);
  for(let n=1;n<=8;n++)buffers[n]=await decode(raw[n]);
  hymnBuf=raw.hymn?await decode(raw.hymn):null;
  if(typeof hymnSrc!=='undefined'&&hymnSrc){hymnSrc=null;if(solved)showReplay(true)}
  lastT=ctx.currentTime; lastCheck=performance.now();
}
function play(buf,gain=1){
  const s=ctx.createBufferSource(); s.buffer=buf; const g=ctx.createGain(); g.gain.value=gain;
  s.connect(g).connect(ctx.destination); s.start(); return s;
}
// Is the audio clock actually moving? (a frozen clock = dead audio on iOS)
let lastT=0,lastCheck=0;
function clockDead(){
  if(!ctx)return true;
  if(ctx.state==='closed')return true;
  const now=performance.now(),t=ctx.currentTime,dead=(ctx.state==='running'&&now-lastCheck>400&&t===lastT);
  lastT=t;lastCheck=now;return dead;
}
function quiet(){                          // ask for one tap to rebuild the audio
  if(!awake)return;
  const st=document.getElementById('start');
  st.textContent='The bells have gone quiet. Tap to wake them';st.classList.remove('hidden');
}
async function rewake(){
  const st=document.getElementById('start');st.textContent='Waking the bells…';
  await buildContext();st.classList.add('hidden');lockScreen();
}
// Keep the iPad from auto-locking while the board is open (Safari 16.4+; Home Screen apps iOS 18.4+)
let lock=null;
async function lockScreen(){try{if('wakeLock' in navigator&&!document.hidden)lock=await navigator.wakeLock.request('screen')}catch(_){}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!awake)return;
  lockScreen();
  if(ctx&&ctx.state!=='running'){ctx.resume().catch(()=>{})}
  lastT=ctx?ctx.currentTime:0;lastCheck=performance.now();
  setTimeout(()=>{if(clockDead()||ctx.state!=='running')quiet()},700);
});
window.addEventListener('pageshow',e=>{if(e.persisted&&awake)setTimeout(()=>{if(clockDead()||ctx.state!=='running')quiet()},700)});

async function deriveKey(seq,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(seq),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:P.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function tryOpen(seq,salt,iv,ct){
  try{const k=await deriveKey(seq,salt);
      await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(iv)},k,b64(ct)); return k}catch(_){return null}
}

function check(){
  const t=trail.slice();
  busy=busy.then(async()=>{
    if(solved)return;
    window.__state.checks++;
    if(t.length>=8){
      const k=await tryOpen(t.slice(-8).join(''),P.psalt,P.piv,P.pct);
      if(k){window.__state.prefixHits++;stir()}
    }
    if(t.length>=14){
      const k=await tryOpen(t.slice(-14).join(''),P.salt,P.iv,P.ct);
      if(k)await win(k);
    }
  });
}

function stir(){
  const w=document.getElementById('water'); w.classList.add('stir');
  say('Below the floor, the water stirs.');
  setTimeout(()=>w.classList.remove('stir'),4000);
}
function say(t){const m=document.getElementById('msg');m.style.opacity=0;setTimeout(()=>{m.textContent=t;m.style.opacity=1},250)}

async function win(key){
  solved=true;
  const ct=hymnCT||await fetchBytes(P.hymn);
  raw.hymn=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.aiv)},key,ct);
  hymnBuf=await decode(raw.hymn);
  window.__state.solved=true;
  document.getElementById('water').classList.add('rise');
  say('The last bell hangs in the air. Then, from somewhere far below, something sings it back.');
  setTimeout(playHymn,1600);
}

let awake=false;
async function wake(){
  if(awake)return rewake();
  const st=document.getElementById('start');st.textContent='Waking the bells…';
  try{
    for(let n=1;n<=8;n++)if(!raw[n])raw[n]=await fetchBytes(`bells/bell-${n}.mp3`);
    if(!hymnCT)hymnCT=await fetchBytes(P.hymn);
    await buildContext();
  }catch(e){st.textContent='Could not load the bells. Check wifi, then tap again';return}
  awake=true;window.__state.awake=true;
  st.classList.add('hidden');
  ['bells','trail','row'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
  lockScreen();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
}

const wrap=document.getElementById('bells');
for(let n=1;n<=8;n++){
  const b=document.createElement('button'); b.className='bell'; b.setAttribute('aria-label','Bell '+n);
  b.innerHTML=bellSVG(n)+`<span>${n}</span>`;
  b.addEventListener('animationend',()=>b.classList.remove('ring'));
  b.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(!ctx||!buffers[n])return;
    if(ctx.state!=='running')ctx.resume().catch(()=>{});
    play(buffers[n]);
    lastT=ctx.currentTime;lastCheck=performance.now();
    b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
    if(solved)return;
    trail.push(n); if(trail.length>40)trail=trail.slice(-40);
    document.getElementById('trail').textContent=trail.slice(-14).join(' ');
    check();
  });
  wrap.appendChild(b);
}
document.getElementById('start').addEventListener('click',wake);
document.getElementById('again').addEventListener('click',()=>{
  trail=[];document.getElementById('trail').textContent='';
  if(solved){solved=false;window.__state.solved=false;document.getElementById('water').classList.remove('rise');
    stopHymn()}
  say('');
});
// The hymn plays once at a time; "Hear it again" only shows once it has finished.
let hymnSrc=null;
function showReplay(on){document.getElementById('replay').style.display=on?'inline-block':'none'}
function playHymn(){
  if(!hymnBuf||hymnSrc)return;
  showReplay(false);
  const s=play(hymnBuf,0.9);hymnSrc=s;
  s.onended=()=>{if(hymnSrc===s){hymnSrc=null;if(solved)showReplay(true)}};
}
function stopHymn(){if(hymnSrc){const s=hymnSrc;hymnSrc=null;try{s.stop()}catch(_){}}showReplay(false)}
document.getElementById('replay').addEventListener('click',playHymn);
// Offline: a service worker keeps every file on the iPad after the first visit.
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
