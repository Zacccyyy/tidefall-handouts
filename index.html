<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Sapphire Cartel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#e9e3d4;--dim:#a9a28f;--gold:#c9a24a;--sapph:#3f6fb5;--bg:#0b1324}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#1d3563 0%,#0b1324 55%,#05080f 100%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;display:flex;justify-content:center;padding:28px 16px 60px}
.wrap{width:100%;max-width:560px}
.door{text-align:center;margin-top:8vh}
.gem{width:64px;height:64px;margin:0 auto 18px}
h1{font-family:Cinzel,serif;font-weight:700;letter-spacing:.22em;font-size:24px;color:var(--ink)}
.tag{font-style:italic;color:var(--dim);margin:8px 0 34px;font-size:19px}
.prompt{font-size:21px;margin-bottom:18px}
form{display:flex;flex-direction:column;gap:12px;align-items:stretch}
input{font-family:Cinzel,serif;font-size:20px;letter-spacing:.2em;text-align:center;padding:14px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(201,162,74,.55);color:var(--ink);border-radius:2px;text-transform:uppercase;outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,74,.18)}
button{font-family:Cinzel,serif;letter-spacing:.25em;font-size:15px;padding:14px;background:linear-gradient(#c9a24a,#9c7a2f);color:#1a1408;border:0;border-radius:2px;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:52px;margin-top:16px;font-style:italic;color:#d9a3a3;font-size:19px}
.fine{margin-top:40px;font-size:15px;color:#6f6a5c;font-style:italic}
.reg h2{font-family:Cinzel,serif;letter-spacing:.2em;text-align:center;font-size:22px;margin-top:6px}
.crest-sm{text-align:center;color:var(--sapph);font-size:26px}
.warn{text-align:center;font-style:italic;color:var(--dim);margin:6px 0 26px}
.reg h3{font-family:Cinzel,serif;font-size:15px;letter-spacing:.2em;color:var(--gold);border-bottom:1px solid rgba(201,162,74,.35);padding-bottom:6px;margin:26px 0 10px}
.sm{font-family:"Cormorant Garamond",serif;letter-spacing:0;color:var(--dim);font-style:italic;font-size:15px}
.row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.pad{flex:0 0 44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;color:var(--gold)}
.sup .pad{border-color:rgba(255,255,255,.15);color:var(--dim)}
.who{font-weight:600;font-size:20px}
.code{font-family:Cinzel,serif;font-size:15px;letter-spacing:.12em;color:#9fc0f0}
.biz{color:var(--ink)}
.note{color:var(--dim);font-style:italic}
.hammer{background:linear-gradient(90deg,rgba(201,162,74,.08),transparent)}
.foot{text-align:center;margin-top:30px;color:var(--dim);font-style:italic}
.foot b{font-family:Cinzel,serif;font-style:normal;color:var(--ink);letter-spacing:.15em}
.fade{animation:f .9s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
</style></head>
<body><main class="wrap" id="app">
<section class="door">
<svg class="gem" viewBox="0 0 100 100"><polygon points="50,6 82,30 70,88 30,88 18,30" fill="#1f3a6b"/><polygon points="50,6 64,30 50,88 36,30" fill="#3f6fb5"/><polygon points="18,30 82,30 64,30 50,6 36,30" fill="#7fa6e0" opacity=".7"/></svg>
<h1>THE SAPPHIRE CARTEL</h1>
<p class="tag">An Evening of Rare Acquisitions</p>
<p class="prompt">The doorman holds out a gloved hand.<br>&ldquo;Your invitation word.&rdquo;</p>
<form id="f" autocomplete="off"><input id="w" aria-label="Invitation word" placeholder="&middot; &middot; &middot;" spellcheck="false"><button id="b">GIVE THE WORD</button></form>
<p class="msg" id="m"></p>
<p class="fine">Guests only. The Cartel remembers faces.</p>
</section>
</main>

const fails=["The doorman doesn't know that word.","He doesn't know that one either. He's started looking at your hands.","“Wrong.” Two large men by the door have stopped talking.","The doorman smiles politely. Somebody behind you cracks their knuckles."];
let n=0;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryWord(word){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(word),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const btn=document.getElementById('b');const m=document.getElementById('m');
  let raw=document.getElementById('w').value.toUpperCase().replace(/[^A-Z]/g,'');
  if(!raw){return}
  const cands=[raw];if(raw.endsWith('S'))cands.push(raw.slice(0,-1));if(raw.startsWith('DOORWORD'))cands.push(raw.slice(8));
  btn.disabled=true;m.textContent='The doorman checks his list…';
  for(const c of cands){try{const html=await tryWord(c);const app=document.getElementById('app');app.innerHTML=html;app.firstElementChild.classList.add('fade');window.scrollTo(0,0);return}catch(_){}}
  m.textContent=fails[Math.min(n,fails.length-1)];n++;btn.disabled=false;
});
